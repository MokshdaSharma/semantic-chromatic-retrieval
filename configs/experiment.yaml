seed: 42
colour_descriptor: hsv          # primary; 'lab' is run as an ablation
selection_metric: AP            # validation criterion (identity mAP); NEVER test
val_identity_frac: 0.15         # share of TRAIN identities held out for validation (DeepFashion)
tau_percentile: 90              # chromatic-relevance threshold: 90th pct of dE00 between same-item val pairs
lambda_grid: [0.0,0.05,0.1,0.15,0.2,0.25,0.3,0.35,0.4,0.45,0.5,0.55,0.6,0.65,0.7,0.75,0.8,0.85,0.9,0.95,1.0]
lam0_grid: [0.0,0.05,0.1,0.15,0.2,0.25,0.3,0.35,0.4,0.45,0.5,0.55,0.6,0.65,0.7,0.75,0.8,0.85,0.9,0.95,1.0]  # SAME grid as lambda_grid (search-budget parity; gamma=0 == fixed)
gamma_grid: [0.0, 0.5, 1.0, 2.0]
pool_grid: [20, 50]
fashion_small:                  # Fashion Product Images (small) loader settings
  min_per_class: 30             # keep (articleType, baseColour) classes with >= this many images
  val_frac: 0.2
  query_frac: 0.1
fashion_xdomain:                # tune on SOURCE domain, test on TARGET domain (needs masterCategory in styles.csv)
  source_master: [Apparel]
  target_master: [Footwear]     # override on the CLI: --target_master Accessories
  val_frac_source: 0.25
  query_frac: 0.1
  min_per_class: 30
generic_labeled:                # any second dataset prepared with scripts/prepare_hf_labeled.py
  min_per_class: 30
  val_frac: 0.2
  query_frac: 0.1
